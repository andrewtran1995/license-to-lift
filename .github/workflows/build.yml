name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # to tag and publish releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5

      # Release build: R8-optimised and not debuggable, so it runs much smoother than a debug APK.
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/release/license-to-lift-release.apk license-to-lift.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: license-to-lift
          path: license-to-lift.apk

      # Every push to main becomes a release, so the newest APK is always at
      # https://github.com/${{ github.repository }}/releases/latest/download/license-to-lift.apk
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" license-to-lift.apk \
            --target "${{ github.sha }}" \
            --title "License to Lift · build ${{ github.run_number }}" \
            --notes "$(git log -1 --pretty=%B)" \
            --latest
